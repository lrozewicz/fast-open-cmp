; Production OPcache tuning for Fast Open CMP.
; Mounted into the WordPress container by docker-compose.prod.yml; rationale in docs/production.md.
; The official wordpress:php8.3-apache image runs mod_php, so this drops into conf.d.

opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Do NOT stat files on every request — compile once and keep it hot.
; Trade-off: deploying new PHP requires restarting the container (or reloading
; Apache) so OPcache picks up the changes. This is the single biggest win for
; consistent admin-page latency (no per-request recompile).
opcache.validate_timestamps=0

; Keep docblocks: some libraries rely on annotations.
opcache.save_comments=1

; JIT — modest win for PHP-heavy paths, harmless otherwise.
opcache.jit=tracing
opcache.jit_buffer_size=64M
