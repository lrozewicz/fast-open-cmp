# Apache site for the container image: non-root on port 8080, logs to stdout/stderr.
Listen 8080
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    # Public URL for redirects Apache builds itself (e.g. /wp-admin -> /wp-admin/). TLS is terminated
    # by the proxy in front and the container port 8080 is not reachable from outside, so the
    # connection's scheme and port must not be used. APACHE_PUBLIC_ORIGIN defaults to WORDPRESS_URL
    # (see /etc/apache2/envvars).
    ServerName ${APACHE_PUBLIC_ORIGIN}
    UseCanonicalName On
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    # Real client IP from the ingress proxy, for logs.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.42.0.0/16 fd42::/56

    # Liveness/readiness: PHP is serving requests (does not touch the database).
    Alias /healthz /var/www/healthz.php
    <Directory /var/www>
        Require all granted
    </Directory>

    <Directory /var/www/html>
        AllowOverride FileInfo
        Options -Indexes +FollowSymLinks
    </Directory>

    # Uploaded files are data, never code.
    <Directory /var/www/html/wp-content/uploads>
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <FilesMatch "^(wp-config\.php|readme\.html|license\.txt|xmlrpc\.php)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
