version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /sdk
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      sdk-dev-dependencies:
        dependency-type: development
  - package-ecosystem: composer
    directory: /plugin
    target-branch: dev
    schedule:
      interval: weekly
